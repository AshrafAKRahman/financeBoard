name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      # The client is generated from the API's schema, so a backend change can break it.
      - "backend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Types, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test -- --run

  client:
    name: The generated client matches the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The schema is dumped from the API itself, so this job needs Python too. No database
      # is involved: `app.openapi` builds the schema without a connection.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the API
        working-directory: backend
        run: uv sync --group dev --frozen

      - name: Install dependencies
        run: npm ci

      # Fails when the checked-in types no longer match what the API serves (R10.AC2).
      - name: Check for drift
        run: npm run check:client

  budget:
    name: Build and size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # NFR2 — the first load stays under 400 KB compressed, report screens excluded
      # because they are fetched only when opened.
      - name: Size budget
        run: npm run check:size
